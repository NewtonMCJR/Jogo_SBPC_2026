<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 90" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78909c"/>
      <stop offset="100%" stop-color="#37474f"/>
    </linearGradient>
  </defs>
  <rect width="210" height="90" rx="8" fill="url(#bgGrad)"/>
  
  <!-- Skull drawing -->
  <g transform="translate(105, 42)">
    <!-- Main head -->
    <path d="M-18 -15 C-18 -28 18 -28 18 -15 C18 -7 14 0 10 5 L10 15 A2 2 0 0 1 8 17 L-8 17 A2 2 0 0 1 -10 15 L-10 5 C-14 0 -18 -7 -18 -15 Z" fill="#efebe9" stroke="#37474f" stroke-width="2.5"/>
    <!-- Eyes and nose -->
    <ellipse cx="-7" cy="-10" rx="4" ry="5" fill="#37474f"/>
    <ellipse cx="7" cy="-10" rx="4" ry="5" fill="#37474f"/>
    <path d="M0 -3 L-2 2 L2 2 Z" fill="#37474f"/>
    <!-- Teeth lines -->
    <line x1="-5" y1="10" x2="5" y2="10" stroke="#37474f" stroke-width="1.5"/>
    <line x1="-4" y1="7" x2="-4" y2="13" stroke="#37474f" stroke-width="1.5"/>
    <line x1="0" y1="7" x2="0" y2="13" stroke="#37474f" stroke-width="1.5"/>
    <line x1="4" y1="7" x2="4" y2="13" stroke="#37474f" stroke-width="1.5"/>
    
    <!-- Pathological porous lesions (red/rust color dots) -->
    <circle cx="-13" cy="-18" r="1.5" fill="#c62828"/>
    <circle cx="-10" cy="-21" r="1" fill="#c62828"/>
    <circle cx="-14" cy="-22" r="0.8" fill="#c62828"/>
    <circle cx="12" cy="-18" r="1.2" fill="#c62828"/>
    <circle cx="15" cy="-15" r="0.9" fill="#c62828"/>
  </g>
</svg>
