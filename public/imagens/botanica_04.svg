<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 90" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f8e9"/>
      <stop offset="100%" stop-color="#dcedc8"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>
  </defs>
  <rect width="210" height="90" rx="8" fill="url(#bgGrad)"/>
  
  <!-- Aura Glows -->
  <circle cx="105" cy="45" r="30" fill="#a5d6a7" fill-opacity="0.3" filter="blur(5px)"/>
  <circle cx="105" cy="45" r="20" fill="#c8e6c9" fill-opacity="0.4" filter="blur(3px)"/>
  
  <!-- Leaves Group -->
  <g transform="translate(105, 45)">
    <!-- Leaf 1 (Left) -->
    <path d="M-5 5 C-25 -10 -20 -30 0 -30 C0 -30 5 -10 -5 5" fill="url(#leafGrad)" transform="rotate(-30)"/>
    <!-- Leaf 2 (Right) -->
    <path d="M5 5 C25 -10 20 -30 0 -30 C0 -30 -5 -10 5 5" fill="url(#leafGrad)" transform="rotate(30)"/>
    <!-- Leaf 3 (Center) -->
    <path d="M0 5 C-15 -15 -10 -35 0 -35 C10 -35 15 -15 0 5" fill="url(#leafGrad)"/>
    
    <!-- Tie/Rope -->
    <ellipse cx="0" cy="5" rx="8" ry="3" fill="#8d6e63" stroke="#5d4037" stroke-width="1"/>
  </g>
</svg>
