<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 90" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2f1"/>
      <stop offset="100%" stop-color="#b2dfdb"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4db6ac"/>
      <stop offset="100%" stop-color="#00796b"/>
    </linearGradient>
  </defs>
  <rect width="210" height="90" rx="8" fill="url(#bgGrad)"/>
  
  <!-- Distillation apparatus -->
  <g transform="translate(105, 45)">
    <!-- Heat/Flame -->
    <path d="M-10 25 C-15 15 0 5 0 5 C0 5 15 15 10 25 Z" fill="#ffb74d" opacity="0.8"/>
    <path d="M-5 25 C-8 18 0 10 0 10 C0 10 8 18 5 25 Z" fill="#ffb74d"/>
    
    <!-- Flask -->
    <!-- Stand ring -->
    <line x1="-25" y1="18" x2="25" y2="18" stroke="#78909c" stroke-width="2"/>
    <!-- Liquid -->
    <path d="M-15 10 C-15 15 15 15 15 10 L15 17 A15 15 0 0 1 -15 17 Z" fill="url(#liquidGrad)"/>
    <!-- Flask glass outline -->
    <path d="M-6 -18 L-6 -10 A18 18 0 0 0 -18 10 A18 18 0 0 0 18 10 A18 18 0 0 0 6 -10 L6 -18 Z" fill="none" stroke="#cfd8dc" stroke-width="2"/>
    <!-- Steam / Condenser tube -->
    <path d="M0 -18 Q20 -18 30 -5 T40 10" fill="none" stroke="#cfd8dc" stroke-width="2"/>
    <!-- Falling Drop -->
    <path d="M40 18 C38 18 37 19 37 20 C37 21 40 24 40 24 C40 24 43 21 43 20 C43 19 42 18 40 18 Z" fill="#00796b"/>
  </g>
</svg>
