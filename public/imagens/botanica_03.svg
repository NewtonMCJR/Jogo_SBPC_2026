<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 90" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="210" height="90" rx="8" fill="url(#bgGrad)"/>
  
  <!-- Capsule 1 -->
  <g transform="translate(85, 45) rotate(30)">
    <!-- Bottom half (Green) -->
    <rect x="-20" y="0" width="12" height="15" rx="6" fill="url(#capGrad)"/>
    <!-- Top half (Transparent/White) -->
    <rect x="-20" y="-15" width="12" height="15" rx="6" fill="#ffffff" fill-opacity="0.6" stroke="#4caf50" stroke-width="1"/>
    <!-- Granules inside top half -->
    <circle cx="-14" cy="-5" r="1.5" fill="#1b5e20"/>
    <circle cx="-16" cy="-8" r="1" fill="#2e7d32"/>
    <circle cx="-12" cy="-10" r="1.2" fill="#81c784"/>
  </g>
  
  <!-- Capsule 2 -->
  <g transform="translate(135, 45) rotate(-45)">
    <!-- Bottom half (Green) -->
    <rect x="-20" y="0" width="12" height="15" rx="6" fill="url(#capGrad)"/>
    <!-- Top half (Transparent/White) -->
    <rect x="-20" y="-15" width="12" height="15" rx="6" fill="#ffffff" fill-opacity="0.6" stroke="#4caf50" stroke-width="1"/>
    <!-- Granules -->
    <circle cx="-15" cy="-6" r="1.5" fill="#1b5e20"/>
    <circle cx="-12" cy="-4" r="1" fill="#2e7d32"/>
    <circle cx="-16" cy="-10" r="1.2" fill="#81c784"/>
  </g>
</svg>
