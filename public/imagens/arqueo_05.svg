<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 90" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#150a07"/>
    </linearGradient>
    <linearGradient id="dnaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>
  <rect width="210" height="90" rx="8" fill="url(#bgGrad)"/>
  
  <!-- Dust particles -->
  <circle cx="40" cy="30" r="1" fill="#ffd54f" opacity="0.6"/>
  <circle cx="170" cy="60" r="1.5" fill="#ffd54f" opacity="0.4"/>
  <circle cx="90" cy="70" r="0.8" fill="#ffd54f" opacity="0.5"/>
  
  <!-- DNA Helix -->
  <g transform="translate(105, 45)">
    <!-- Sine waves representing DNA strands -->
    <path d="M-60 0 Q-45 -20 -30 0 T0 0 T30 0 T60 0" fill="none" stroke="url(#dnaGrad)" stroke-width="3"/>
    <path d="M-60 0 Q-45 20 -30 0 T0 0 T30 0 T60 0" fill="none" stroke="#e0f2f1" stroke-width="3" opacity="0.8"/>
    
    <!-- Connectors -->
    <line x1="-45" y1="-10" x2="-45" y2="10" stroke="#ffd54f" stroke-width="2"/>
    <line x1="-15" y1="-10" x2="-15" y2="10" stroke="#ffd54f" stroke-width="2"/>
    <line x1="15" y1="-10" x2="15" y2="10" stroke="#ffd54f" stroke-width="2"/>
    <line x1="45" y1="-10" x2="45" y2="10" stroke="#ffd54f" stroke-width="2"/>
  </g>
</svg>
