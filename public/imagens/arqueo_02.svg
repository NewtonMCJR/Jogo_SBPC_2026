<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 90" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#caa435"/>
    </linearGradient>
  </defs>
  <rect width="210" height="90" rx="8" fill="url(#bgGrad)"/>
  
  <!-- Sand dunes / layers -->
  <path d="M-10 60 Q60 50 120 70 T230 60 L230 100 L-10 100 Z" fill="#bcaaa4" opacity="0.5"/>
  
  <!-- Partially buried bone -->
  <g transform="translate(90, 50) rotate(-10)">
    <path d="M-20 -3 C-23 -6 -28 -6 -28 -3 C-28 0 -23 0 -20 -3 L20 -3 C23 -6 28 -6 28 -3 C28 0 23 0 20 -3 Z" fill="#efebe9" stroke="#8d6e63" stroke-width="2"/>
  </g>
  
  <!-- Brush -->
  <g transform="translate(135, 30) rotate(-40)">
    <!-- Handle -->
    <rect x="-3" y="-30" width="6" height="30" rx="2" fill="#8d6e63"/>
    <!-- Metal ring -->
    <rect x="-5" y="0" width="10" height="6" fill="#b0bec5"/>
    <!-- Bristles -->
    <path d="M-5 6 L-8 18 L8 18 L5 6 Z" fill="#ffe082" stroke="#8d6e63" stroke-width="1"/>
    <!-- Dust particles -->
    <circle cx="-12" cy="22" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="10" cy="24" r="1" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
